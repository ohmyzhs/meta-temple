# temple 컨테이너(nginx:alpine) 설정 — 정적 사이트 + 실시간 동석 서버로 넘기기
# /srv/temple/nginx.conf 로 올라가 /etc/nginx/conf.d/default.conf 에 읽기 전용으로 붙는다.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # 실시간 동석 (WebSocket). 실제 접속 IP 는 Cloudflare 가 CF-Connecting-IP 로 넘겨준다
  location /ws {
    proxy_pass http://temple-live:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # 공유 연등·기와·돌탑
  location /api/ {
    proxy_pass http://temple-live:8080;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    client_max_body_size 8k;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
